<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Anything">
  <title>Anything</title>
  <!-- The mark: an open bracket becoming a filled square.
       "Anything" turns a description (the open, unresolved bracket) into a
       real, running application (the solid form). One idea, one shape. -->
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C5CE7"/>
      <stop offset="1" stop-color="#00B8A9"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="#0B0B10"/>
  <path d="M46 30 H34 a10 10 0 0 0-10 10 v48 a10 10 0 0 0 10 10 h12"
        fill="none" stroke="url(#a)" stroke-width="9" stroke-linecap="round"/>
  <rect x="62" y="42" width="44" height="44" rx="12" fill="url(#a)"/>
</svg>
