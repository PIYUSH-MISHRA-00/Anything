<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00eeff",
                        "background-light": "#f5f8f8",
                        "background-dark": "#050505",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            background-color: #050505;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .neural-glow {
            background: radial-gradient(circle at center, rgba(0, 238, 255, 0.15) 0%, rgba(139, 92, 246, 0.1) 30%, transparent 70%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-dark text-slate-100 flex flex-col items-center justify-center min-h-screen relative">
<!-- Subtle Background Neural Glow -->
<div class="absolute inset-0 z-0 flex items-center justify-center">
<div class="w-[500px] h-[500px] neural-glow rounded-full blur-3xl opacity-50"></div>
</div>
<!-- Main Content Container -->
<div class="relative z-10 flex flex-col items-center justify-center w-full px-8 max-w-md">
<!-- Center Visual Node -->
<div class="mb-12 relative">
<!-- Node core -->
<div class="w-16 h-16 rounded-full bg-primary/20 flex items-center justify-center border border-primary/40 shadow-[0_0_40px_rgba(0,238,255,0.3)]">
<span class="material-symbols-outlined text-primary text-4xl font-light">
                    all_inclusive
                </span>
</div>
<!-- Surrounding subtle nodes/orbits -->
<div class="absolute -top-4 -right-4 w-3 h-3 rounded-full bg-primary/40 blur-[1px]"></div>
<div class="absolute bottom-2 -left-6 w-2 h-2 rounded-full bg-violet-500/40 blur-[1px]"></div>
</div>
<!-- Branding -->
<div class="text-center">
<h1 class="text-white tracking-tight text-5xl font-bold leading-tight mb-2">
                Anything
            </h1>
<p class="text-slate-400 text-lg font-light tracking-wide leading-normal">
                Turn AI into your interface.
            </p>
</div>
<!-- Progress Indicator -->
<div class="fixed bottom-16 left-0 right-0 px-12 w-full flex flex-col items-center gap-4">
<div class="w-full max-w-[240px] h-[1px] bg-slate-800 rounded-full overflow-hidden">
<div class="h-full bg-gradient-to-r from-transparent via-primary to-transparent w-1/3 animate-pulse shadow-[0_0_10px_rgba(0,238,255,0.8)]" style="width: 45%;"></div>
</div>
<span class="text-[10px] uppercase tracking-[0.2em] text-slate-500 font-medium">Initializing Neural Engine</span>
</div>
</div>
<!-- Decorative Elements -->
<div class="absolute top-0 left-0 w-full h-full pointer-events-none">
<div class="absolute top-1/4 left-10 w-px h-24 bg-gradient-to-b from-transparent via-primary/10 to-transparent"></div>
<div class="absolute bottom-1/4 right-10 w-px h-24 bg-gradient-to-b from-transparent via-primary/10 to-transparent"></div>
</div>
</body></html>
