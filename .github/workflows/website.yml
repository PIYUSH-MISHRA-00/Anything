name: Website

# Builds the VitePress site and proves it is publishable. It does NOT deploy.
#
# Deployment moved to Cloudflare Pages, which builds this same directory
# straight from the private repository. GitHub Pages cannot serve it: on the
# Free plan `POST /repos/.../pages` answers 422, "Your current plan does not
# support GitHub Pages for this repository", and this repository is private by
# choice. Leaving the deploy steps in place only produced a red X on every
# push.
#
# The build runs on every push and PR touching the site, so a broken page is
# caught in review rather than in production.
#
# `ignoreDeadLinks: false` in the VitePress config means a dead internal link
# FAILS THE BUILD. That is deliberate: a dead link in documentation is a broken
# promise to a reader, and this is the cheapest place to catch one.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify the build produced a site
        run: |
          set -e
          dist=docs/.vitepress/dist
          test -f "$dist/index.html" || { echo "No index.html produced."; exit 1; }
          pages=$(find "$dist" -name '*.html' | wc -l)
          echo "Rendered $pages pages."
          [ "$pages" -ge 10 ] || { echo "Only $pages pages — the site is incomplete."; exit 1; }
          # The site is served from the ROOT of its host, so assets must be
          # /assets/... and never /<repo>/assets/... . A wrong base looks fine
          # locally and 404s every stylesheet in production.
          if ! grep -q '"/assets/' "$dist/index.html"; then
            echo "Assets are not served from the root base path."; exit 1
          fi
          if grep -q '"/Anything/assets/' "$dist/index.html"; then
            echo "Assets still carry the old GitHub Pages /Anything/ base."; exit 1
          fi
          echo "OK."
