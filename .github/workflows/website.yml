name: Website

# Builds the VitePress site and publishes it to GitHub Pages.
#
# The build runs on every push and PR touching the site, so a broken page is
# caught in review. Deployment happens only from the default branch.
#
# `ignoreDeadLinks: false` in the VitePress config means a dead internal link
# FAILS THE BUILD. That is deliberate: a dead link in documentation is a broken
# promise to a reader, and this is the cheapest place to catch one.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

# Pages needs these; nothing else in this repository does.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race. Queue instead of cancelling, so a merged
# change is not silently dropped by a later one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify the build produced a site
        run: |
          set -e
          dist=docs/.vitepress/dist
          test -f "$dist/index.html" || { echo "No index.html produced."; exit 1; }
          pages=$(find "$dist" -name '*.html' | wc -l)
          echo "Rendered $pages pages."
          [ "$pages" -ge 10 ] || { echo "Only $pages pages — the site is incomplete."; exit 1; }
          # The site is served from /Anything/. A missing base breaks every
          # asset URL in a way that looks fine locally and 404s in production.
          grep -q '/Anything/assets/' "$dist/index.html" \
            || { echo "Assets are not prefixed with the GitHub Pages base path."; exit 1; }
          echo "OK."

      - uses: actions/configure-pages@v6
        if: github.ref == 'refs/heads/main'
        with:
          # Auto-enable Pages (source = GitHub Actions) on the first run so the
          # deploy doesn't fail with "Get Pages site failed / Not Found" before
          # Pages has been turned on in repo settings.
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: website/docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
