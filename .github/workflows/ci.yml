name: CI

# Vision Milestone V10 introduced this pipeline. IS-R58 made it able to pass.
#
# WHAT WAS WRONG, MEASURED AT IS-R58 PHASE 1 (2026-08-08):
#
#   * "Verify formatting" ran `dart format --set-exit-if-changed` against a
#     repository where 424 of 668 Dart files were unformatted. Exit 1.
#   * "Analyze" ran bare `flutter analyze` under a step name promising a
#     comparison against "the documented baseline". `flutter analyze` exits
#     non-zero on ANY issue and this repository has a documented, non-empty
#     baseline, so the step could never pass. It performed no comparison.
#
# GitHub Actions halts a job at its first failing step, so `flutter test` had
# NEVER EXECUTED IN CI. The consequence was the reason IS-R58 exists: 89
# architectural certification invariants and 40+ mutation proofs, built across
# eleven milestones to prevent architectural drift, gated nothing at all.
#
# Every stage below is now independently visible, so a certification failure
# names itself in the job list instead of hiding inside a generic test run.
#
# WHAT WAS STILL MISSING, MEASURED AT IS-P01 PHASE 1 (2026-08-08):
#
#   There was no `flutter build` step of ANY kind. 102 invariants gated every
#   commit; whether the product compiled into a shippable artifact was gated by
#   nothing -- and it did not. `flutter build apk --release` failed at
#   :app:packageRelease because the release build type signed with the DEBUG
#   key, and the release manifest declared no INTERNET permission, so every AI
#   call would have failed silently in a shipped build.
#
#   Both are fixed in IS-P01. The `build-release` job below exists so neither
#   can regress unnoticed again.

on:
  push:
    branches: [main, v2.0.0]
  pull_request:
    branches: [main, v2.0.0]

jobs:
  analyze-and-test:
    name: Format, Analyze, Certify, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      # Compares against the explicit baseline in tool/analyze_gate.sh rather
      # than requiring zero issues. Fails on any NEW error, warning or info.
      # Suppresses nothing, excludes nothing, lowers no lint.
      - name: Analyze against the documented baseline
        run: bash tool/analyze_gate.sh

      # ── CERTIFICATION IS ITS OWN STEP, ON PURPOSE ─────────────────────────
      # It ran inside the general test sweep before, where a failure was one
      # line in 2,000. Architectural regression now fails a step that says so.
      - name: Architectural certification (102 invariants)
        run: flutter test test/r46_architectural_integrity_certification_test.dart

      # P16–P18: open-world semantic generation must stay factory-free.
      - name: P16/P17/P18 dynamicity + semantic open-world certification
        run: |
          flutter test \
            test/dynamic/p16_architecture_mutation_test.dart \
            test/dynamic/p16_unknown_domain_pipeline_test.dart \
            test/dynamic/p15_search_image_test.dart \
            test/dynamic/p17_semantic_schema_test.dart \
            test/dynamic/p17_relationship_generation_test.dart \
            test/dynamic/p17_generic_ui_test.dart \
            test/dynamic/p17_full_crud_test.dart \
            test/dynamic/p17_unknown_domain_expanded_test.dart \
            test/dynamic/p17_dynamicity_mutation_test.dart \
            test/dynamic/p17_action_binding_test.dart \
            test/dynamic/p17_capability_resolution_test.dart \
            test/dynamic/p18_unknown_domain_battery_test.dart \
            test/dynamic/p18_semantic_boundary_test.dart

      # The milestone suites carry the mutation-proven behavioural guarantees
      # for commit, installation, distribution, trust, governance, retention
      # and durable collections. Named separately for the same reason.
      - name: Milestone guarantee suites (R45-R62)
        run: |
          flutter test \
            test/r45_experience_entry_pipeline_test.dart \
            test/r50_canonical_lifecycle_retention_test.dart \
            test/r51_governance_framework_test.dart \
            test/r52_experience_identity_provenance_test.dart \
            test/r53_experience_distribution_test.dart \
            test/r54_experience_installation_test.dart \
            test/r55_experience_commit_test.dart \
            test/r56_durable_collection_store_test.dart \
            test/r60_experience_package_codec_test.dart \
            test/r61_experience_execution_contract_test.dart \
            test/r62_experience_orchestrator_test.dart

      - name: Full test suite with coverage
        run: flutter test --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

  documentation-validation:
    name: Documentation validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify architecture docs exist for every Vision Milestone
        run: |
          set -e
          required=(
            "docs/architecture/KNOWLEDGE_ENGINE.md"
            "docs/architecture/SOFTWARE_ARCHITECT_ENGINE.md"
            "docs/architecture/APPLICATION_ENGINEERING_ENGINE.md"
            "docs/architecture/FEATURE_DISCOVERY_ENGINE.md"
            "docs/architecture/SOLUTION_REASONING_ENGINE.md"
            "docs/architecture/DESIGN_REVIEW_ENGINE.md"
            "docs/architecture/EVOLUTION_ENGINE.md"
            "docs/architecture/RUNTIME_INTELLIGENCE_LAYER.md"
            "docs/architecture/WORLD_MODEL_AND_SEMANTIC_GRAPH.md"
          )
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "Missing required documentation file: $f"
              exit 1
            fi
          done
          echo "All required architecture documentation present."

  package-validation:
    name: Package / artifact validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Verify pubspec is well-formed and dependencies resolve
        run: flutter pub outdated --no-dev-dependencies || true

      - name: Confirm no forbidden files are tracked
        run: |
          set -e
          forbidden_patterns=(".env" "local.properties" "key.properties" "*.jks" "*.keystore")
          for pattern in "${forbidden_patterns[@]}"; do
            matches=$(git ls-files | grep -E "${pattern//\*/.*}$" || true)
            if [ -n "$matches" ]; then
              echo "Forbidden file tracked in git: $matches"
              exit 1
            fi
          done
          echo "No forbidden files tracked."

  build-release:
    name: Build release App Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      # compileSdk/targetSdk are pinned at 37 and the runner image does not
      # ship that platform. From API 37 Google publishes MINOR-VERSIONED
      # platforms, so the package is `android-37.0` and the directory AGP
      # looks for is `android-37.0` too -- `platforms;android-37` does not
      # exist and installing it silently succeeds while resolving nothing.
      - name: Install the pinned Android platform
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Install dependencies
        run: flutter pub get

      # THE GATE THIS REPOSITORY LACKED FOR 62 MILESTONES.
      #
      # No release keystore exists in CI (key.properties is gitignored and is
      # never committed -- see the forbidden-files check below), so this builds
      # with the debug-signing fallback. That is deliberate: the point is to
      # prove the project COMPILES AND PACKAGES, which is exactly what was
      # silently untrue. Signing a publishable artifact happens on a release
      # tag, from a machine holding the real keystore -- see RELEASE_GUIDE.md.
      - name: Build App Bundle (release)
        run: flutter build appbundle --release

      - name: Build APK (release)
        run: flutter build apk --release

      # A release build that produces no INTERNET permission ships an app whose
      # every AI call fails. Assert the merged release manifest, not the source
      # file, because debug/ and profile/ manifests are NOT merged into release.
      - name: Verify the merged release manifest declares INTERNET
        run: |
          set -e
          manifest=$(find build/app/intermediates -name AndroidManifest.xml -path '*release*' | head -1)
          if [ -z "$manifest" ]; then
            echo "No merged release manifest found."; exit 1
          fi
          echo "Checking $manifest"
          grep -q 'android.permission.INTERNET' "$manifest"             || { echo 'FAIL: merged release manifest does not declare INTERNET.'; exit 1; }
          echo "OK: INTERNET is present in the merged release manifest."

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
