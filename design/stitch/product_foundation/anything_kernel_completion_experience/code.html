<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Entrance animations */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .animate-fade-up {
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }
        .delay-500 { animation-delay: 500ms; }

        /* Gentle pulse for the "ready" state icon */
        @keyframes gentlePulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }
        
        .animate-pulse-gentle {
            animation: gentlePulse 4s ease-in-out infinite;
        }
        
        /* Shimmer effect for the card */
        .shimmer-card {
            position: relative;
            overflow: hidden;
        }
        .shimmer-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to bottom right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.1) 40%,
                rgba(255, 255, 255, 0.3) 50%,
                rgba(255, 255, 255, 0.1) 60%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(30deg);
            animation: shimmer 8s infinite linear;
            pointer-events: none;
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(30deg); }
            20% { transform: translateX(100%) translateY(100%) rotate(30deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(30deg); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-surface text-on-surface min-h-screen overflow-hidden selection:bg-primary-container selection:text-on-primary-container font-body-md text-body-md antialiased relative">
<!-- Ambient Shader Background -->
<div class="fixed inset-0 z-0 opacity-40">

</div>
<!-- Main Content Canvas -->
<main class="relative z-10 min-h-screen flex flex-col px-[20px] pt-24 pb-32 max-w-[400px] mx-auto md:max-w-[768px] md:px-[32px] md:justify-center md:pt-0">
<!-- Header Text -->

<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary tracking-tight mb-2">Everything's set.</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-sm mx-auto">Your personal intelligence hub is ready.</p>
</div>
<!-- The "Born" Application Card -->
<div class="shimmer-card bg-surface-container-lowest/80 backdrop-blur-2xl rounded-xl border border-surface-container-high/50 p-8 flex flex-col items-center justify-center text-center animate-fade-up opacity-0 delay-200 shadow-[0_20px_40px_-15px_rgba(17,39,138,0.1)] relative group cursor-default h-[320px] md:h-[400px]">
<!-- Subtle gradient glow behind icon -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-48 h-48 bg-primary-fixed-dim/20 rounded-full blur-3xl -z-10 group-hover:bg-primary-fixed-dim/30 transition-colors duration-1000"></div>
<!-- Assembled Icon / Avatar representing the newly created intelligence -->
<div class="w-24 h-24 md:w-32 md:h-32 rounded-full bg-gradient-to-tr from-surface-container-highest to-surface-container-lowest flex items-center justify-center shadow-sm border border-surface-container-high relative mb-6 animate-pulse-gentle">
<!-- Particle-like ring around the icon -->
<div class="absolute inset-[-4px] rounded-full border border-primary/10 border-dashed animate-[spin_20s_linear_infinite]"></div>
<span class="material-symbols-outlined text-[48px] md:text-[64px] text-primary" style="font-variation-settings: 'FILL' 1;">eco</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Intelligence Dashboard</h2>
<p class="font-body-md text-body-md text-on-surface-variant/80 max-w-[240px]">A serene space curated just for you.</p>
<!-- Enter Button (Ghost/Tonal) -->

                Enter Hub

</button>
</div>
