<style>
          .ambient-shadow {
              box-shadow: 0 10px 30px -10px rgba(17, 39, 138, 0.15);
          }
          .glass-panel {
              background: rgba(252, 249, 248, 0.7);
              backdrop-filter: blur(24px);
              -webkit-backdrop-filter: blur(24px);
              border: 1px solid rgba(255, 255, 255, 0.5);
          }
          
          /* Voice Waveform Animation */
          .wave-container {
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 4px;
              height: 48px;
          }
          .wave-bar {
              width: 4px;
              border-radius: 4px;
              background-color: theme('colors.primary');
              animation: pulse 1.2s infinite ease-in-out alternate;
          }
          .wave-bar:nth-child(1) { height: 12px; animation-delay: -0.4s; }
          .wave-bar:nth-child(2) { height: 24px; animation-delay: -0.2s; }
          .wave-bar:nth-child(3) { height: 36px; animation-delay: 0s; }
          .wave-bar:nth-child(4) { height: 24px; animation-delay: -0.2s; }
          .wave-bar:nth-child(5) { height: 12px; animation-delay: -0.4s; }

          @keyframes pulse {
              0% { transform: scaleY(0.5); opacity: 0.5; }
              100% { transform: scaleY(1); opacity: 1; }
          }
      </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-surface min-h-screen relative overflow-hidden font-body-md text-body-md antialiased selection:bg-primary selection:text-on-primary">

</div>

<!-- Top App Bar (Desktop: hidden md:flex, Mobile: flex) -->

<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full overflow-hidden bg-surface-variant flex items-center justify-center ambient-shadow hover:scale-[1.02] transition-transform duration-300">

</div>
</div>
<div class="font-headline-md text-headline-md font-semibold text-primary dark:text-primary-fixed">
                Anything
            </div>
<div>
<button class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface dark:text-on-surface hover:bg-surface-variant transition-colors hover:scale-[1.02] duration-300">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</header>

                What would you like to create?
            </h1>
<!-- Voice Interaction Area -->
<div class="mt-stack-md flex flex-col items-center gap-6">
<button class="w-20 h-20 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-lg hover:scale-105 active:scale-95 transition-all duration-300 group" id="voiceBtn">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
<!-- Animated Waveform (Hidden by default, shown on interaction) -->
<div class="wave-container opacity-0 transition-opacity duration-300 h-12" id="waveform">
<div class="wave-bar"></div>
<div class="wave-bar"></div>
<div class="wave-bar"></div>
<div class="wave-bar"></div>
<div class="wave-bar"></div>
</div>
<p class="font-body-md text-body-md text-secondary">Tap to speak</p>
</div>
</section>

<div class="flex justify-between items-end mb-stack-sm">

<button class="font-label-sm text-label-sm text-primary hover:underline">View all</button>
</div>

<script>
        // Simple micro-interaction for the voice button
        document.addEventListener('DOMContentLoaded', () => {
            const voiceBtn = document.getElementById('voiceBtn');
            const waveform = document.getElementById('waveform');
            let isRecording = false;

            voiceBtn.addEventListener('click', () => {
                isRecording = !isRecording;
                if (isRecording) {
                    voiceBtn.classList.add('bg-error', 'text-on-error');
                    voiceBtn.classList.remove('bg-primary', 'text-on-primary');
                    waveform.classList.remove('opacity-0');
                } else {
                    voiceBtn.classList.remove('bg-error', 'text-on-error');
                    voiceBtn.classList.add('bg-primary', 'text-on-primary');
                    waveform.classList.add('opacity-0');
                }
            });
        });
    </script>
