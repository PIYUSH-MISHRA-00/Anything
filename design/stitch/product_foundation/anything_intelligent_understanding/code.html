<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Smooth Entrance Animation */
        @keyframes subtleScaleFade {
            0% { opacity: 0; transform: scale(0.95) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        
        /* Floating Animation */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        /* Soft Pulse for Loading Text */
        @keyframes softPulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        /* Particle Background Animation */
        @keyframes moveParticles {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-50px, -50px); }
        }
        
        .animate-enter {
            animation: subtleScaleFade 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        
        .animate-float {
            animation: floatSlow 6s ease-in-out infinite;
        }
        
        .animate-pulse-text {
            animation: softPulse 2s ease-in-out infinite;
        }

        .ambient-gradient {
            background: radial-gradient(circle at 50% 50%, rgba(17, 39, 138, 0.05) 0%, rgba(252, 249, 248, 1) 100%);
        }

        .glass-container {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 32px 64px -16px rgba(17, 39, 138, 0.08), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
        }

        /* Custom Particles */
        .particles-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            background: rgba(17, 39, 138, 0.1);
            border-radius: 50%;
            animation: moveParticles 20s infinite alternate ease-in-out;
        }
    </style>
<style>

<body class="bg-background text-on-background min-h-screen font-body-md overflow-hidden relative selection:bg-primary-container selection:text-on-primary-container">
<!-- Ambient Background Effects -->
<div class="fixed inset-0 ambient-gradient z-0 pointer-events-none"></div>
<!-- CSS Particles -->
<div class="particles-bg">
<div class="particle" style="width: 300px; height: 300px; top: -10%; left: -5%; filter: blur(60px); animation-delay: 0s;"></div>
<div class="particle" style="width: 400px; height: 400px; bottom: -20%; right: -10%; filter: blur(80px); background: rgba(186, 195, 255, 0.15); animation-delay: -5s;"></div>
<div class="particle" style="width: 250px; height: 250px; top: 40%; left: 60%; filter: blur(50px); animation-delay: -10s;"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 w-full min-h-screen flex items-center justify-center px-container-padding py-stack-lg">
<div class="max-w-[800px] w-full mx-auto flex flex-col items-center justify-center h-full animate-enter">
<!-- Expanded Intent Surface -->
<div class="glass-container rounded-[48px] p-12 md:p-16 w-full text-center flex flex-col items-center justify-center animate-float relative overflow-hidden transition-all duration-1000 ease-out">
<!-- Inner Glow Ring -->
<div class="absolute inset-0 rounded-[48px] border-[1px] border-primary-fixed-dim/20 mix-blend-overlay pointer-events-none"></div>
<!-- The User's Request -->
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary tracking-tight mb-stack-md leading-tight">
                    "Create a study planner from this PDF and make it beautiful"
                </h1>
<!-- Context-Aware Chips (Recognized Inputs) -->
<div class="flex flex-wrap justify-center gap-unit mb-stack-lg opacity-0" style="animation: subtleScaleFade 0.8s 0.4s forwards;">
<div class="flex items-center gap-2 bg-surface-container/50 px-4 py-2 rounded-full border border-surface-container-highest backdrop-blur-sm transition-colors hover:bg-surface-container hover:border-outline-variant cursor-default">
<span class="material-symbols-outlined text-[18px] text-primary icon-fill">description</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Study_Guide.pdf</span>
</div>
<div class="flex items-center gap-2 bg-surface-container/50 px-4 py-2 rounded-full border border-surface-container-highest backdrop-blur-sm transition-colors hover:bg-surface-container hover:border-outline-variant cursor-default">
<span class="material-symbols-outlined text-[18px] text-tertiary-container">link</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">External Source</span>
</div>
</div>
<!-- App Birth Experience: Phase 1 (Creation Animation) -->
<div class="flex flex-col items-center opacity-0" style="animation: subtleScaleFade 0.8s 0.8s forwards;">
<!-- Custom Creation Motion (CSS driven, soft gathering) -->
<div class="relative w-24 h-24 mb-stack-sm flex items-center justify-center">
<div class="absolute inset-0 rounded-full border-2 border-dashed border-primary-fixed/40 animate-[spin_8s_linear_infinite]"></div>
<div class="absolute w-16 h-16 rounded-full bg-primary/10 blur-xl animate-pulse"></div>
<div class="absolute w-8 h-8 rounded-full bg-primary/20 blur-md animate-[ping_3s_cubic-bezier(0,0,0.2,1)_infinite]"></div>
<!-- Core intelligence icon, very subtle -->
<span class="material-symbols-outlined text-primary text-[32px] animate-pulse-text">auto_awesome</span>
</div>
<!-- Progress Message -->
<p class="font-body-lg text-body-lg text-secondary animate-pulse-text tracking-wide">
                        Understanding your idea...
                    </p>
</div>
</div>
</div>
</main>
