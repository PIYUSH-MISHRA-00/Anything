<style>
        /* Pulse Animation for the Central Core */
        @keyframes subtle-pulse {
            0% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 20px rgba(17, 39, 138, 0.2); }
            50% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 40px rgba(17, 39, 138, 0.4); }
            100% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 20px rgba(17, 39, 138, 0.2); }
        }
        
        @keyframes orbit {
            from { transform: rotate(0deg) translateX(120px) rotate(0deg); }
            to { transform: rotate(360deg) translateX(120px) rotate(-360deg); }
        }
        
        @keyframes orbit-reverse {
            from { transform: rotate(180deg) translateX(150px) rotate(-180deg); }
            to { transform: rotate(-180deg) translateX(150px) rotate(180deg); }
        }
        
        @keyframes orbit-offset {
            from { transform: rotate(90deg) translateX(100px) rotate(-90deg); }
            to { transform: rotate(450deg) translateX(100px) rotate(-450deg); }
        }

        .core-pulse {
            animation: subtle-pulse 3s infinite ease-in-out;
        }
        
        .orbit-1 { animation: orbit 15s linear infinite; }
        .orbit-2 { animation: orbit-reverse 20s linear infinite; }
        .orbit-3 { animation: orbit-offset 12s linear infinite; }

        /* Ambient Glass Shadows */

            box-shadow: 0 8px 32px rgba(17, 39, 138, 0.08);
        }
    </style>
